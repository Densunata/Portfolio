<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Defaults for crawlers and link previews (which do not run JavaScript).
         The app updates title/description per route (app/src/hooks/usePageMetadata.ts).
         Keep the description in sync with app/src/content/site.ts (enforced by a test). -->
    <title>Raiden A. Victor | Programmer / System Developer</title>
    <meta
      name="description"
      content="Raiden A. Victor: Programmer and System Developer specializing in full-stack web applications with .NET, React, and Laravel."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#5c7e8f" />
    <meta name="color-scheme" content="light dark" />

    <!-- Sets the theme before first paint so the wrong one never flashes.
         Keep in sync with app/src/lib/theme.ts (enforced by a test). -->
    <script>
      ;(function () {
        var saved = /(?:^|;\s*)portfolio-theme=(dark|light)(?:;|$)/.exec(document.cookie)
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = saved ? saved[1] : prefersDark ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#12191d' : '#5c7e8f')
      })()
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Twitter. Image URLs become absolute when SITE_URL is set at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Raiden A. Victor" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Raiden A. Victor | Programmer / System Developer" />
    <meta
      property="og:description"
      content="Raiden A. Victor: Programmer and System Developer specializing in full-stack web applications with .NET, React, and Laravel."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Raiden A. Victor, Programmer / System Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Raiden A. Victor | Programmer / System Developer" />
    <meta
      name="twitter:description"
      content="Raiden A. Victor: Programmer and System Developer specializing in full-stack web applications with .NET, React, and Laravel."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <noscript>This site requires JavaScript. Contact: anoreraiden4@gmail.com</noscript>
    <div id="root"></div>
    <script type="module" src="/app/src/main.tsx"></script>
  </body>
</html>
